<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- ИСХОДНИК OG-БАННЕРА. Не редактируйте PNG рядом — он собирается отсюда
       (см. frontend/scripts/og/README или make-цель): SVG версионируется и
       правится, PNG только результат.

       Почему здесь НЕТ ни одного <text>: баннер растеризуется sharp внутри
       контейнера, а в образе нет ни fontconfig, ни шрифтов — любой <text>
       выходит рядом квадратиков-тофу (проверено на кириллице). Поэтому всё,
       включая слово «DopaFit», взято путями из frontend/public/logo.svg: пути
       от шрифтов не зависят и растеризуются одинаково везде. -->
  <defs>
    <!-- Фон повторяет градиент приложения: верхняя точка градиента приложения
         (#1E1208, она же theme_color в манифесте) к более холодному низу. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1208"/>
      <stop offset="0.45" stop-color="#161412"/>
      <stop offset="1" stop-color="#0E0B1A"/>
    </linearGradient>
    <!-- Фирменный синий из иконки, размытый в подсветку под логотипом: даёт
         глубину, но не спорит с логотипом за внимание в мелкой ленте. -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#006FFD" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#006FFD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="315" rx="560" ry="330" fill="url(#glow)"/>


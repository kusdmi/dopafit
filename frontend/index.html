    <meta

      content="DopaFit — тренировки, программы и прогресс в одном приложении: планируйте занятия, ведите замеры и следите за результатами вместе с тренером."

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DopaFit" />

      property="og:description"
      content="Планируйте тренировки, ведите замеры и следите за прогрессом вместе с тренером."

    <script>
      (function () {
        for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
          document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
        }
      })();

name: Tests and builds (manual)

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Backend tests and build
        type: boolean
        default: true
      frontend:
        description: Frontend tests and build
        type: boolean
        default: true
      image:
        description: Production Docker build (no publish or deploy)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    if: inputs.backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dopafit
          POSTGRES_PASSWORD: dopafit
          POSTGRES_DB: dopafit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dopafit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOPAFIT_DATABASE_URL: postgresql://dopafit:dopafit@localhost:5432/dopafit
      DOPAFIT_TEST_DATABASE_URL: postgresql://dopafit:dopafit@localhost:5432/dopafit_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter dopafit-backend test
      - name: Build
        run: pnpm --filter dopafit-backend build

  frontend:
    if: inputs.frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter dopafit-frontend test:run
      - name: Build
        run: pnpm --filter dopafit-frontend build

  image:
    if: inputs.image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

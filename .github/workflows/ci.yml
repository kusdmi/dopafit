name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contract: ${{ steps.filter.outputs.contract }}
      e2e: ${{ steps.filter.outputs.e2e }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'contracts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            frontend:
              - 'frontend/**'
              - 'contracts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            contract:
              - 'backend/src/http/**'
              - 'contracts/**'
              - 'frontend/src/shared/api/schema.d.ts'
            e2e:
              - 'e2e/**'
              - 'frontend/**'
              - 'backend/**'
              - 'contracts/**'
              - 'docker-compose*.yml'
              - 'Dockerfile'
              - 'Makefile'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            deploy:
              - 'deploy/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high
      - name: Lint and types
        run: pnpm --filter dopafit-backend lint

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high
      - name: Lint
        run: pnpm --filter dopafit-frontend lint
      - name: Types
        run: pnpm --filter dopafit-frontend typecheck

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    env:
      OPENAPI_SPEC: ../contracts/openapi.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The contract and the frontend types are generated artefacts: regenerating
      # them must not produce a diff, or the committed ones have drifted from the code.
      - name: Contract and generated types are up to date
        run: |
          pnpm contracts
          git diff --exit-code contracts/openapi.json frontend/src/shared/api/schema.d.ts

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and types (browser tests run on request)
        run: pnpm --filter dopafit-e2e lint

  deploy-configs:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      DOPAFIT_APP_DOMAIN: app.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Validate prod compose
        run: |
          touch deploy/.env.prod
          mkdir -p deploy/conf.d
          docker compose -f deploy/docker-compose.prod.yml config --quiet
      - name: Validate Caddyfile
        run: >-
          docker run --rm
          -e DOPAFIT_APP_DOMAIN
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2 caddy validate --config /etc/caddy/Caddyfile

  # Main builds and publishes the image for the automatic deployment.
  prod-image:
    needs: [changes, backend, frontend, contract, e2e, deploy-configs]
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the image tag
        id: meta
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dopafit-app" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          # The public VAPID key is resolved at build time (import.meta.env), so it has to
          # be baked in here. It must match DOPAFIT_VAPID_PUBLIC_KEY on the stand, or the
          # push service refuses every subscription.
          build-args: |
            VITE_VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: prod-image
    # prod-image runs under always(), and a job reached that way propagates "skipped" to
    # anything depending on it the ordinary way — which silently published an image and
    # never deployed it. Depend on its actual result instead.
    if: >-
      always() &&
      needs.prod-image.result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time, and let a running one finish: cancelling mid-way could leave
    # the stand between versions.
    concurrency:
      group: deploy-stand
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ needs.prod-image.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The key on the VPS is pinned to ci-deploy.sh with command="...", so this
          # string is read as its argument rather than executed.
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes "$USER@$HOST" "$TAG"
